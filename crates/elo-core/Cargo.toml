[package]
name = "elo-core"
description = "Núcleo do eloBoost: erros, modelos, banco local e migrations. Sem dependência do Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
# O núcleo não tem motivo para usar código inseguro. Quando os wrappers Win32
# entrarem (Épico 1), eles ficam isolados em `src-tauri/src/system/ffi.rs`.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[features]
# Expõe utilitários de teste (banco em memória) para outros crates do workspace.
testing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = "3"
