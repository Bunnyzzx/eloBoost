name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tipos, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build de produção
        run: pnpm build

  backend:
    name: Backend Rust (fmt, clippy, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versão e os componentes vêm de rust-toolchain.toml, para que o CI e a
      # máquina do desenvolvedor rodem exatamente o mesmo Clippy.
      - name: Instalar toolchain fixado
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Dependências do Tauri no Linux. O alvo do produto é Windows; o Linux é
      # usado apenas para validar a compilação e rodar os testes do núcleo.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

      # Verifica o código atrás de `#[cfg(windows)]` sem precisar de um runner
      # Windows. `cargo check`/`clippy` não linkam, então o alvo GNU basta — e
      # `cfg(windows)` é verdadeiro para ele, expondo os mesmos erros de FFI.
      - name: Alvo Windows (verificação cruzada)
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get install -y gcc-mingw-w64-x86-64
          CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc \
            cargo clippy --target x86_64-pc-windows-gnu --workspace --all-targets \
            --all-features -- -D warnings

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar toolchain fixado
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes do backend
        run: cargo test --workspace

      - name: Compilar o aplicativo
        run: cargo build --workspace
