name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tipos, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build de produção
        run: pnpm build

  backend:
    name: Backend Rust (fmt, clippy, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Dependências do Tauri no Linux. O alvo do produto é Windows; o Linux é
      # usado apenas para validar a compilação e rodar os testes do núcleo.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes do backend
        run: cargo test --workspace

      - name: Compilar o aplicativo
        run: cargo build --workspace
